# À chaque push sur main : vérifie le contenu, compile, puis publie dist/
# dans le dépôt public julienf68250-wq/souffle-app (GitHub Pages).
# Le code source reste dans ce dépôt privé. La publication n'a lieu que si le
# secret DEPLOY_KEY (clé limitée au seul dépôt souffle-app) est configuré.
name: Publier Souffle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Clé de publication présente ?
        id: cle
        env:
          K: ${{ secrets.DEPLOY_KEY }}
        run: echo "ok=$([ -n "$K" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - if: steps.cle.outputs.ok == '1'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: julienf68250-wq/souffle-app
          publish_branch: main
          publish_dir: ./dist
          commit_message: Publication
